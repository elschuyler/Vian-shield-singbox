name: Build Vianshield Engine & APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      singbox_version:
        description: 'sing-box Git tag or release version to compile'
        required: true
        default: 'v1.11.0'

permissions:
  contents: read

jobs:
  build-singbox-engine:
    name: Build sing-box libbox.aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box repository
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.singbox_version || 'v1.11.0' }}
          path: sing-box-source
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sing-box-source/go.sum

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Configure Android NDK Environment
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            if [ -d "${ANDROID_HOME}/ndk/26.3.11579264" ]; then
              NDK_PATH="${ANDROID_HOME}/ndk/26.3.11579264"
            elif [ -d "/usr/local/lib/android/sdk/ndk/26.3.11579264" ]; then
              NDK_PATH="/usr/local/lib/android/sdk/ndk/26.3.11579264"
            fi
          fi
          echo "Selected NDK path: $NDK_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Verify NDK & Go Toolchain
        run: |
          echo "=== Go Toolchain ==="
          go version
          echo "=== NDK Environment ==="
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
          ls -ld "$ANDROID_NDK_HOME"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -n 1

      - name: Install SagerNet gomobile toolchain
        working-directory: sing-box-source
        run: |
          make lib_install

      - name: Compile libbox.aar via official build_libbox
        working-directory: sing-box-source
        run: |
          go run ./cmd/internal/build_libbox -target android

      - name: Verify libbox.aar artifact
        run: |
          test -f sing-box-source/libbox.aar
          ls -lh sing-box-source/libbox.aar

      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-source/libbox.aar
          retention-days: 14

  build-vianshield-apk:
    name: Build Vianshield Debug APK
    needs: build-singbox-engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vianshield repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download libbox.aar artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Verify libbox.aar placement
        run: |
          test -f app/libs/libbox.aar
          ls -lh app/libs/libbox.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Dual-ARM Debug APK (armeabi-v7a + arm64-v8a)
        run: |
          mkdir -p dist
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/vianshield-dual-arm-debug.apk

      - name: Verify Staged Dual-ARM Debug APK
        run: |
          echo "=== Verifying staged dual-ARM APK in dist/ ==="
          if [ ! -s dist/vianshield-dual-arm-debug.apk ]; then
            echo "::error::dist/vianshield-dual-arm-debug.apk does not exist or is empty!"
            ls -la app/build/outputs/apk/debug/ || echo "Directory app/build/outputs/apk/debug/ does not exist"
            exit 1
          fi
          echo "=== Verifying native ABI contents in APK ==="
          unzip -l dist/vianshield-dual-arm-debug.apk "lib/*"
          unzip -l dist/vianshield-dual-arm-debug.apk | grep "lib/armeabi-v7a/" || { echo "::error::Missing armeabi-v7a native libraries!"; exit 1; }
          unzip -l dist/vianshield-dual-arm-debug.apk | grep "lib/arm64-v8a/" || { echo "::error::Missing arm64-v8a native libraries!"; exit 1; }
          echo "=== Dual-ARM APK verified successfully ==="
          ls -lh dist/vianshield-dual-arm-debug.apk

      - name: Diagnostic listing on failure
        if: failure()
        run: |
          echo "=== Diagnostic listing of Gradle build outputs ==="
          ls -laR app/build/outputs/ || true

      - name: Upload Dual-ARM Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-dual-arm-debug-apk
          path: dist/vianshield-dual-arm-debug.apk
          retention-days: 14
