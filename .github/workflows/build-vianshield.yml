name: Build Vianshield Engine & APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      singbox_version:
        description: 'sing-box Git tag or release version to compile'
        required: true
        default: 'v1.11.0'

permissions:
  contents: read

jobs:
  build-singbox-engine:
    name: Build sing-box libbox.aar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sing-box repository
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ github.event.inputs.singbox_version || 'v1.11.0' }}
          path: sing-box-source
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sing-box-source/go.sum

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set up Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Install SagerNet gomobile toolchain
        working-directory: sing-box-source
        run: |
          make lib_install

      - name: Compile libbox.aar via official build_libbox
        working-directory: sing-box-source
        run: |
          go run ./cmd/internal/build_libbox -target android

      - name: Verify libbox.aar artifact
        run: |
          test -f sing-box-source/libbox.aar
          ls -lh sing-box-source/libbox.aar

      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box-source/libbox.aar
          retention-days: 14

  build-vianshield-apk:
    name: Build Vianshield Debug APK
    needs: build-singbox-engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vianshield repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download libbox.aar artifact
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: app/libs

      - name: Verify libbox.aar placement
        run: |
          test -f app/libs/libbox.aar
          ls -lh app/libs/libbox.aar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Check if Debug APK exists
        id: check_apk
        if: always()
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "apk_exists=true" >> $GITHUB_OUTPUT
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "apk_exists=false" >> $GITHUB_OUTPUT
            echo "Debug APK file was not produced."
          fi

      - name: Upload Debug APK Artifact
        if: steps.check_apk.outputs.apk_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
