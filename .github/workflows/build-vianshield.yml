name: Build Vianshield ARM64 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vianshield:
    name: Build Native libbox & ARM64 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Vianshield repository
        uses: actions/checkout@v4

      - name: Checkout sing-box repository (pinned v1.14.4)
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: 'v1.14.4'
          path: sing-box-source
          fetch-depth: 1
          submodules: recursive

      - name: Set up Go 1.25.5
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: sing-box-source/go.sum

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r28c)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true

      - name: Configure Android NDK & Toolchain Environment
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            if [ -d "${ANDROID_HOME}/ndk/28.2.13676358" ]; then
              NDK_PATH="${ANDROID_HOME}/ndk/28.2.13676358"
            elif [ -d "/usr/local/lib/android/sdk/ndk/28.2.13676358" ]; then
              NDK_PATH="/usr/local/lib/android/sdk/ndk/28.2.13676358"
            elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
              NDK_PATH="$ANDROID_NDK_HOME"
            fi
          fi
          echo "Selected NDK path: $NDK_PATH"
          test -d "$NDK_PATH" || { echo "::error::NDK path does not exist: $NDK_PATH"; exit 1; }
          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$LLVM_BIN" || { echo "::error::LLVM bin directory not found at $LLVM_BIN"; exit 1; }

          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: 1. Print Selected Toolchains & Initialize SagerNet gomobile
        working-directory: sing-box-source
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$(go env GOPATH)/bin:$PATH"
          export GOTOOLCHAIN=local
          echo "=== 1. Selected Toolchain Versions ==="
          echo "Android NDK Home: $ANDROID_NDK_HOME"
          test -d "$ANDROID_NDK_HOME" || { echo "::error::ANDROID_NDK_HOME does not exist!"; exit 1; }
          if [ -f "$ANDROID_NDK_HOME/source.properties" ]; then
            cat "$ANDROID_NDK_HOME/source.properties"
          fi
          echo "--- Clang Version ---"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version | head -n 2
          echo "--- LLD Version ---"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/ld.lld" --version | head -n 2
          echo "--- aarch64 Cross-Compiler & Selected Linker ---"
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" --version | head -n 2
          which aarch64-linux-android24-clang || true
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" -### -E -x c /dev/null 2>&1 | grep -i "clang version" || true
          echo "--- Go Version ---"
          go version
          echo "GOTOOLCHAIN: $GOTOOLCHAIN"
          echo "--- Installing SagerNet gomobile / gobind v0.1.13 ---"
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          which gomobile
          gomobile version || true
          which gobind
          echo "--- Initializing gomobile with NDK r28c ---"
          gomobile init

      - name: 2. Verify Linker R_AARCH64_GOTPCREL32 Capability Check
        run: |
          echo "=== 2. Relocation 315 (R_AARCH64_GOTPCREL32) Capability Check ==="
          cat << 'EOF' > /tmp/test_reloc315.cpp
          #include <stdexcept>
          #include <typeinfo>
          void trigger_rtti_reloc() {
              throw std::range_error("relocation_315_validation");
          }
          EOF
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" \
            -shared -fPIC -fexperimental-relative-c++-abi-vtables -frtti \
            -o /tmp/libtest_reloc315.so /tmp/test_reloc315.cpp
          test -s /tmp/libtest_reloc315.so || { echo "::error::Linker failed to evaluate R_AARCH64_GOTPCREL32"; exit 1; }
          echo "Relocation 315 check passed successfully! Linker is fully compatible with Cronet AArch64 C++ RTTI."
          rm -f /tmp/test_reloc315.cpp /tmp/libtest_reloc315.so

      - name: 3. Build Native Engine for Android (build_libbox)
        working-directory: sing-box-source
        run: |
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$(go env GOPATH)/bin:$PATH"
          export GOTOOLCHAIN=local
          echo "=== 3. Building libbox.aar via official build_libbox ==="
          go run ./cmd/internal/build_libbox -target android
          test -s libbox.aar || { echo "::error::sing-box-source/libbox.aar was not generated!"; exit 1; }

      - name: 4. Verify ARM64 Native Binary in libbox.aar
        run: |
          echo "=== 4. Verifying ARM64 (arm64-v8a) native engine ==="
          unzip -l sing-box-source/libbox.aar | grep "jni/arm64-v8a/libbox.so" || { echo "::error::Missing jni/arm64-v8a/libbox.so in libbox.aar!"; exit 1; }
          ARM64_SIZE=$(unzip -p sing-box-source/libbox.aar jni/arm64-v8a/libbox.so | wc -c)
          echo "ARM64 libbox.so size: $ARM64_SIZE bytes"
          if [ "$ARM64_SIZE" -lt 1000000 ]; then
            echo "::error::ARM64 libbox.so is suspiciously small ($ARM64_SIZE bytes)! Compilation or linking failed.";
            exit 1;
          fi
          echo "ARM64 native binary successfully verified."

      - name: 5. Package and Inspect libbox.aar
        run: |
          echo "=== 5. Packaging and inspecting libbox.aar ==="
          mkdir -p app/libs
          cp sing-box-source/libbox.aar app/libs/libbox.aar
          ls -lh app/libs/libbox.aar
          echo "--- JNI Native Library Listing ---"
          unzip -l app/libs/libbox.aar "jni/*"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 6. Run Gradle Compilation and Unit Tests
        run: |
          echo "=== 6. Running Gradle Unit Tests ==="
          gradle :app:testDebugUnitTest --stacktrace

      - name: 7. Assemble ARM64 Debug APK
        run: |
          echo "=== 7. Assembling ARM64 Debug APK ==="
          mkdir -p dist
          gradle :app:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk dist/vianshield-arm64-debug.apk

      - name: 8. Verify ARM64-Only APK Packaging & Native ABIs
        run: |
          echo "=== 8. Verifying staged ARM64-only APK in dist/ ==="
          if [ ! -s dist/vianshield-arm64-debug.apk ]; then
            echo "::error::dist/vianshield-arm64-debug.apk does not exist or is empty!"
            ls -la app/build/outputs/apk/debug/ || echo "Directory app/build/outputs/apk/debug/ does not exist"
            exit 1
          fi
          echo "=== Verifying native ABI contents in APK ==="
          unzip -l dist/vianshield-arm64-debug.apk "lib/*"
          echo "--- Checking ARM64 presence ---"
          unzip -l dist/vianshield-arm64-debug.apk | grep "lib/arm64-v8a/libbox.so" || { echo "::error::Missing arm64-v8a native library in APK!"; exit 1; }
          echo "--- Verifying NO non-ARM64 ABIs exist in APK ---"
          if unzip -l dist/vianshield-arm64-debug.apk | grep "lib/armeabi-v7a/"; then
            echo "::error::Found forbidden armeabi-v7a native library in ARM64-only APK!";
            exit 1;
          fi
          if unzip -l dist/vianshield-arm64-debug.apk | grep "lib/x86/"; then
            echo "::error::Found forbidden x86 native library in ARM64-only APK!";
            exit 1;
          fi
          if unzip -l dist/vianshield-arm64-debug.apk | grep "lib/x86_64/"; then
            echo "::error::Found forbidden x86_64 native library in ARM64-only APK!";
            exit 1;
          fi
          echo "=== Native Library Size Breakdown in APK ==="
          unzip -l dist/vianshield-arm64-debug.apk "lib/*"
          echo "=== ARM64 APK verified successfully ==="
          ls -lh dist/vianshield-arm64-debug.apk

      - name: Diagnostic listing on failure
        if: failure()
        run: |
          echo "=== Diagnostic listing of build outputs ==="
          ls -laR app/build/outputs/ || true
          ls -la app/libs/ || true

      - name: 9. Upload Single ARM64 Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vianshield-arm64-debug-apk
          path: dist/vianshield-arm64-debug.apk
          retention-days: 14
